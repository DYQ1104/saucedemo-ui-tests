name: ui-tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run configuration unit tests
        run: python -m pytest -c pytest-unit.ini -v

  smoke:
    name: Smoke / ${{ matrix.browser }}
    if: github.event_name != 'schedule'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      UI_BROWSER: ${{ matrix.browser }}
      UI_HEADLESS: "true"
      UI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-smoke-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m pytest -m smoke -v 2>&1 | tee pytest-output.txt

      - name: Annotate failures
        if: failure()
        run: |
          grep -aE "^(FAILED|ERROR)|^E   |TimeoutException|AssertionError" pytest-output.txt \
            | tail -30 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            reports/runs/
            logs/
          retention-days: 7
          if-no-files-found: warn

  regression:
    name: Regression / ${{ matrix.browser }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      UI_BROWSER: ${{ matrix.browser }}
      UI_HEADLESS: "true"
      UI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-regression-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full regression
        run: python -m pytest -v 2>&1 | tee pytest-output.txt

      - name: Annotate failures
        if: failure()
        run: |
          grep -aE "^(FAILED|ERROR)|^E   |TimeoutException|AssertionError" pytest-output.txt \
            | tail -30 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            reports/runs/
            logs/
          retention-days: 14
          if-no-files-found: warn
